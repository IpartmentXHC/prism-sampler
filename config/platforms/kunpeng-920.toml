name = "kunpeng-920"
architecture = "aarch64"
full_support_kernel = "6.6"
best_effort_kernels = ["5.10", "6.12"]
capacity_headroom = 0.80
core_events = [
  "task-clock", "cycles", "instructions", "cache-references", "cache-misses",
  "L1-dcache-loads", "L1-dcache-load-misses", "L2D_CACHE", "L2D_CACHE_REFILL",
  "mem_access", "remote_access", "stall_frontend", "stall_backend",
  "context-switches", "cpu-migrations", "page-faults",
]
uncore_globs = ["hisi_sccl*_ddrc*", "hisi_sccl*_hha*", "hisi_sccl*_l3c*"]
uncore_event_names = [
  "flux_rd", "flux_wr",
  "rx_sccl", "rx_outer", "rd_ddr_64b", "rd_ddr_128b", "wr_ddr_64b", "wr_ddr_128b",
  "rd_cpipe", "rd_hit_cpipe", "rd_spipe", "rd_hit_spipe",
  "wr_cpipe", "wr_hit_cpipe", "wr_spipe", "wr_hit_spipe", "victim_num",
]
