[profiles.minimal]
required = ["prism"]
optional = ["phase-marker"]

[profiles.relationship]
required = ["prism", "snapshot"]
optional = ["phase-marker"]

[profiles.online-relationship]
required = ["prism", "live-relations", "snapshot"]
optional = ["phase-marker"]

[profiles.policy]
required = ["prism", "snapshot"]
optional = ["perf-core", "perf-uncore", "phase-marker"]

[profiles.pressure-v2]
required = ["prism", "live-relations", "snapshot"]
optional = ["perf-core", "perf-uncore", "phase-marker"]

[profiles.diagnostic]
